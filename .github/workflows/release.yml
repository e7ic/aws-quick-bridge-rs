name: Package & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS Universal app bundle
        run: sh scripts/package-macos.sh
      - name: Archive macOS Universal zip
        run: |
          version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          mkdir -p dist
          zip_path="dist/Quick-Bridge-${version}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "target/release/Quick Bridge.app" "$zip_path"
          shasum -a 256 "$zip_path" > "${zip_path}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Quick-Bridge-macos-universal
          path: dist/Quick-Bridge-*-macos-universal.zip*
          if-no-files-found: error

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows x64 portable zip
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package-windows.ps1
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zip = Get-Item target/release/Quick-Bridge-*-windows-x64.zip | Select-Object -First 1
          $dest = Join-Path 'dist' $zip.Name
          Copy-Item -Path $zip.FullName -Destination $dest -Force
          $hash = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($zip.Name)" | Set-Content -Path "$dest.sha256" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: Quick-Bridge-windows-x64
          path: dist/Quick-Bridge-*-windows-x64.zip*
          if-no-files-found: error

  release:
    needs: [package-macos, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
